spring:
  application:
    name: smartfarm-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/smartfarm_service}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    out-of-order: true

  data:
    web:
      pageable:
        # ?size 상한 — 과대 페이지 요청으로 인한 과다 조회 방지(전역, reviewer P3)
        max-page-size: 100

  servlet:
    multipart:
      # 서비스 검증 캡(10MB, DiagnosisService)보다 여유를 둬 캡 응답을 D002로 일관되게 매핑한다
      max-file-size: 15MB
      max-request-size: 15MB

  task:
    scheduling:
      # @Scheduled 빈 4개(EnvironmentSnapshotPoller·EnvSnapshotPurgeScheduler·
      # RefreshTokenPurgeScheduler·PrescriptionSweeper)가 기본 단일 스레드를 공유한다(리뷰 P3) —
      # 60s 폴러가 임계치 웹훅을 동기 발송하는 동안(최대 5s 타임아웃) 다른 스케줄러 주기가 밀리지
      # 않도록 풀을 2로 늘린다.
      pool-size: 2

server:
  port: 8085
  # 외부 직접 바인딩 차단 — nginx(127.0.0.1) 경유만 허용 (contract §0)
  address: 127.0.0.1
  # nginx TLS 종단 뒤 X-Forwarded-* 반영 (HSTS·리다이렉트 스킴 정합)
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 30m
  refresh-token-validity: 14d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 진단 이미지 원본 저장 base 디렉터리(contract §3 Phase 3) — 기본값 없음, 운영 필수(systemd env 파일 주입)
image:
  storage-dir: ${IMAGE_STORAGE_DIR}

ai-server:
  url: ${AI_SERVER_URL:http://127.0.0.1:8000}
  connect-timeout: 3s
  read-timeout: 30s

# 환경 대시보드 ai-server 프록시 전용 타임아웃(contract §3 Phase 3 handoff) — 대시보드 위젯 진입 시
# 동기 호출이라 진단(30s)만큼 기다리게 하지 않는다. base-url·connect-timeout은 ai-server 설정 재사용.
environment-dashboard:
  read-timeout: 5s

# 처방 비동기 job — 단일 워커가 순차 처리(contract §3)
prescription:
  # ai-server 처방 응답 대기(웜 ~16s, 콜드 LLM 웜업 고려 넉넉히 — handoff)
  read-timeout: 120s
  # 429(혼잡) 백오프 재시도 간격 — 재시도 횟수 = 목록 크기(handoff: 2회)
  retry-backoffs: 5s, 15s
  # 스위퍼 주기(ISO-8601 Duration) — 테스트는 크게 잡아 자동 발화 차단
  sweep-initial-delay: PT5M
  sweep-fixed-delay: PT5M

# 처방 완료/실패 디스코드 웹훅 발송(contract §3 Phase 3) — 실패는 WARN 로그만, 처방 상태 무영향
webhook:
  timeout: 5s
  detail-base-url: https://farm.luma200ok.com

# refresh_tokens 퍼지(RefreshTokenPurgeScheduler) — 만료+7일 유예 경과분 삭제, 주기는 1일 1회
refresh-token:
  purge-initial-delay: P1D
  purge-fixed-delay: P1D
  # 배치 삭제 크기(리뷰 P2-1) — 대량 적체 시 단일 DELETE 장기 락 경합 방지, 반복 호출로 분할
  purge-batch-size: 1000

# 환경 시계열 폴러(EnvironmentSnapshotPoller, contract §4.6) — ai-server GET /environment/today를
# 60s 주기로 조회해 env_snapshots 적재 + EnvironmentCache 갱신
environment-snapshot:
  poll-initial-delay: PT60S
  poll-fixed-delay: PT60S

# env_snapshots 90일 보존 퍼지(EnvSnapshotPurgeScheduler, contract §4.6) — RefreshTokenPurgeScheduler와
# 동일 패턴(배치 삭제, 1일 1회)
env-snapshot:
  purge-initial-delay: P1D
  purge-fixed-delay: P1D
  purge-batch-size: 1000

# KMA 단기예보(getVilageFcst) 프록시(contract §4.8, 이슈 #56) — 전역 고정 지점(환경 대시보드와 동일
# 데모 온실 위치). base-url은 공공데이터포털 고정 엔드포인트(시크릿 아님). service-key는 시크릿(운영
# .env 주입, 평문 커밋 금지) — 디코딩(Decoding) 키 사용 권장(인코딩 키는 쿼리파라미터 인코딩과 겹쳐
# 이중 인코딩으로 인증 실패 가능). grid-nx/ny도 배포 시 값 등록 필수(기본값 없음).
# AI 챗봇 프록시(contract §4.7, 이슈 #54) — 동기 호출, 계약 타임아웃 30s.
# base-url·connect-timeout은 ai-server 설정 재사용(진단·처방·환경 대시보드와 동일 원칙 — 응답
# 타임아웃만 기능별로 분리한다).
chat:
  read-timeout: 30s

kma:
  base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService2.0
  service-key: ${KMA_SERVICE_KEY}
  grid-nx: ${KMA_GRID_NX}
  grid-ny: ${KMA_GRID_NY}
  connect-timeout: 3s
  read-timeout: 5s

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# 운영 프로필 — Swagger/OpenAPI 비활성.
# ⚠️ 운영 기동 시 SPRING_PROFILES_ACTIVE=prod 필수 (미지정 시 Swagger가 노출됨)
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
