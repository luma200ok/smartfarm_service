spring:
  application:
    name: smartfarm-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/smartfarm_service}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    out-of-order: true

server:
  port: 8085

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 30m
  refresh-token-validity: 14d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
