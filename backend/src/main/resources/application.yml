spring:
  application:
    name: smartfarm-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/smartfarm_service}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    out-of-order: true

  data:
    web:
      pageable:
        # ?size 상한 — 과대 페이지 요청으로 인한 과다 조회 방지(전역, reviewer P3)
        max-page-size: 100

  servlet:
    multipart:
      # 서비스 검증 캡(10MB, DiagnosisService)보다 여유를 둬 캡 응답을 D002로 일관되게 매핑한다
      max-file-size: 15MB
      max-request-size: 15MB

  task:
    scheduling:
      # @Scheduled 빈 6개(EnvironmentSnapshotPoller·EnvSnapshotPurgeScheduler·
      # RefreshTokenPurgeScheduler·PrescriptionSweeper·SensorSimulatorScheduler(#90)·
      # SensorReadingPurgeScheduler(#90))가 기본 단일 스레드를 공유한다(리뷰 P3) — 60s 폴러가
      # 임계치 웹훅을 동기 발송하는 동안(최대 5s 타임아웃) 다른 스케줄러 주기가 밀리지 않도록
      # 풀을 3으로 늘린다(#90 — 시뮬레이터 tick까지 추가돼 2로는 여유가 부족).
      pool-size: 3

server:
  port: 8085
  # 외부 직접 바인딩 차단 — nginx(127.0.0.1) 경유만 허용 (contract §0)
  address: 127.0.0.1
  # nginx TLS 종단 뒤 X-Forwarded-* 반영 (HSTS·리다이렉트 스킴 정합)
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 30m
  refresh-token-validity: 14d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 진단 이미지 원본 저장 base 디렉터리(contract §3 Phase 3) — 기본값 없음, 운영 필수(systemd env 파일 주입)
image:
  storage-dir: ${IMAGE_STORAGE_DIR}

ai-server:
  url: ${AI_SERVER_URL:http://127.0.0.1:8000}
  connect-timeout: 3s
  read-timeout: 30s

# 환경 대시보드 ai-server 프록시 전용 타임아웃(contract §3 Phase 3 handoff) — 대시보드 위젯 진입 시
# 동기 호출이라 진단(30s)만큼 기다리게 하지 않는다. base-url·connect-timeout은 ai-server 설정 재사용.
environment-dashboard:
  read-timeout: 5s

# 처방 비동기 job — 단일 워커가 순차 처리(contract §3)
prescription:
  # ai-server 처방 응답 대기(웜 ~16s, 콜드 LLM 웜업 고려 넉넉히 — handoff)
  read-timeout: 120s
  # 429(혼잡) 백오프 재시도 간격 — 재시도 횟수 = 목록 크기(handoff: 2회)
  retry-backoffs: 5s, 15s
  # 스위퍼 주기(ISO-8601 Duration) — 테스트는 크게 잡아 자동 발화 차단
  sweep-initial-delay: PT5M
  sweep-fixed-delay: PT5M

# 처방 완료/실패 디스코드 웹훅 발송(contract §3 Phase 3) — 실패는 WARN 로그만, 처방 상태 무영향
webhook:
  timeout: 5s
  detail-base-url: https://farm.luma200ok.com

# refresh_tokens 퍼지(RefreshTokenPurgeScheduler) — 만료+7일 유예 경과분 삭제, 주기는 1일 1회
refresh-token:
  purge-initial-delay: P1D
  purge-fixed-delay: P1D
  # 배치 삭제 크기(리뷰 P2-1) — 대량 적체 시 단일 DELETE 장기 락 경합 방지, 반복 호출로 분할
  purge-batch-size: 1000

# 환경 시계열 폴러(EnvironmentSnapshotPoller, contract §4.6) — ai-server GET /environment/today를
# 60s 주기로 조회해 env_snapshots 적재 + EnvironmentCache 갱신
environment-snapshot:
  poll-initial-delay: PT60S
  poll-fixed-delay: PT60S

# env_snapshots 90일 보존 퍼지(EnvSnapshotPurgeScheduler, contract §4.6) — RefreshTokenPurgeScheduler와
# 동일 패턴(배치 삭제, 1일 1회)
env-snapshot:
  purge-initial-delay: P1D
  purge-fixed-delay: P1D
  purge-batch-size: 1000

# KMA 단기예보(getVilageFcst) 프록시(contract §4.8, 이슈 #56) — 전역 고정 지점(환경 대시보드와 동일
# 데모 온실 위치). base-url은 공공데이터포털 고정 엔드포인트(시크릿 아님). service-key는 시크릿(운영
# .env 주입, 평문 커밋 금지) — 디코딩(Decoding) 키 사용 권장(인코딩 키는 쿼리파라미터 인코딩과 겹쳐
# 이중 인코딩으로 인증 실패 가능). grid-nx/ny도 배포 시 값 등록 필수(기본값 없음).
# AI 챗봇 프록시(contract §4.7, 이슈 #54) — 동기 호출, 계약 타임아웃 120s(이슈 #80 — 초판 30s는
# 같은 로컬 LLM을 쓰는 처방 경로(120s)보다 짧아 실사용에서 항상 타임아웃했다. 전역 동시성 가드
# (Semaphore 2)가 스레드 점유 상한을 보장하므로 타임아웃을 늘려도 고갈 위험은 없다).
# base-url·connect-timeout은 ai-server 설정 재사용(진단·처방·환경 대시보드와 동일 원칙 — 응답
# 타임아웃만 기능별로 분리한다).
chat:
  read-timeout: 120s

# 가상 장비 시뮬레이터(contract §4.11, 이슈 #90) — 실기기 부재를 시뮬레이션으로 한정 해제.
# false면 운영에서 실기기 연동 시 사용 — 빈 폴러가 도는 게 아니라 빈 자체가 안 뜨게
# @ConditionalOnProperty로 등록을 막는다(SensorSimulatorScheduler).
smartfarm:
  simulator:
    enabled: ${SMARTFARM_SIMULATOR_ENABLED:true}

# 가상 장비 시뮬레이터 tick 주기 + 농장당/전역 1틱 최대 생성 행 수(contract §4.11 사이클 2 정정) —
# 상한은 센서 대수가 아니라 행 수 기준(장비당 지표 수만큼 곱해지므로 대수 기준은 추정을 왜곡한다).
# 초과분은 생성하지 않고 WARN 로그만 남긴다(조용히 자르지 않는다).
sensor-simulator:
  tick-initial-delay: PT60S
  tick-fixed-delay: PT60S
  max-rows-per-farm: 300
  # 전역 상한(사이클 2 리뷰 P2-4) — 농장당 상한만으로는 농장 생성 상한이 아직 없는 상태(#91)에서
  # 농장 수만큼 곱해져 무한정 커진다. ⚠️ 이 값은 SensorReadingPurgeScheduler의 purge 처리량
  # 산정식(최악 유입 = 이 값 × 1,440틱/일)의 유일한 입력 변수다(사이클 2 리뷰 P3-A — 이전에는
  # @Value 기본값(2000)에만 의존해 운영자가 이 노브를 yml에서 볼 수 없었다). 이 값을 올리면
  # sensor-reading.purge-batch-size(및 MAX_BATCHES)도 반드시 같이 재산정해야 한다 — 안 하면
  # purge가 유입을 못 따라가 90일 보존이 조용히 깨진다.
  max-rows-per-tick: 2000

# sensor_readings 90일 보존 퍼지(SensorReadingPurgeScheduler, contract §4.11) —
# EnvSnapshotPurgeScheduler와 배치 삭제 구조는 같지만 배치 크기는 재산정했다(사이클 2 리뷰 P1-2 —
# env_snapshots 대비 유입량이 120~432배라 같은 상수(1000×20배치)로는 보존 90일이 성립하지 않았다.
# 산정 근거는 SensorReadingPurgeScheduler 클래스 주석 참조).
sensor-reading:
  purge-initial-delay: P1D
  purge-fixed-delay: P1D
  purge-batch-size: 20000

# control_apply_logs 90일 보존 퍼지(ControlApplyLogPurgeScheduler, contract §4.12 상한) —
# 구조는 위 두 퍼지와 같지만 상수는 이 도메인 유입량으로 다시 산정했다("패턴 그대로" 금지, 사이클 2
# 리뷰 P1-2의 교훈). 적용 이력은 사용자 조작 1회당 1행이라 배경 유입이 없다: 현실 유입 2,000행/일,
# 자동화 클라이언트를 가정한 방어적 상한도 1,440,000행/일이며 5,000×600배치 = 3,000,000행/일로
# 안전계수 2를 만족한다(계산식 전문은 ControlApplyLogPurgeScheduler 클래스 주석).
control-apply-log:
  purge-initial-delay: P1D
  purge-fixed-delay: P1D
  purge-batch-size: 5000

# 홈 대시보드 농장 카드 집계(contract, 이슈 #139) — 농장 생성 상한이 아직 없어(#70) 방어적으로
# 집계 대상 농장 수를 상한한다(초과분은 에러 없이 자르고 WARN 로그만 남김, DashboardService 참고).
dashboard:
  max-farms: 50

kma:
  base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
  # 기본값 필수(핫픽스 #73) — env 미설정 시 placeholder 해석 실패/빈 문자열 Integer 변환으로
  # 애플리케이션 기동 자체가 깨진다. 예보는 부가 기능이므로 미설정이면 조용히 W001로 degrade해야 한다.
  service-key: ${KMA_SERVICE_KEY:}
  grid-nx: ${KMA_GRID_NX:60}
  grid-ny: ${KMA_GRID_NY:127}
  connect-timeout: 3s
  read-timeout: 5s

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# 운영 프로필 — Swagger/OpenAPI 비활성.
# ⚠️ 운영 기동 시 SPRING_PROFILES_ACTIVE=prod 필수 (미지정 시 Swagger가 노출됨)
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
