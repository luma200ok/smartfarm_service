# 테스트 전용 설정 — 시크릿은 명시적 테스트 더미값
jwt:
  secret: "test-only-jwt-secret-for-integration-tests-0123456789"
  access-token-validity: 30m
  refresh-token-validity: 14d

cors:
  allowed-origins: http://localhost:3000

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# 타임아웃 테스트를 빠르게 하려고 응답 타임아웃을 짧게 둔다(url은 테스트별 MockWebServer로 동적 오버라이드)
ai-server:
  connect-timeout: 1s
  read-timeout: 2s

# 환경 대시보드 전용 클라이언트도 진단과 동일하게 짧게(connect-timeout은 ai-server 값을 그대로 재사용 —
# EnvironmentClientConfig 참고. 이슈 #22 리뷰: 프로덕션 기본 5s로 테스트를 돌리면 타임아웃 테스트가
# 느려질 뿐 아니라 대기 구간이 길어져 환경에 따른 변동 여지가 커진다 — 진단(2s)과 동일하게 통일)
environment-dashboard:
  read-timeout: 2s

# 처방 비동기 job — 백오프를 짧게 줄여 429 재시도 테스트를 빠르게 수행.
# 스위퍼는 1시간으로 키워 테스트 실행 중 자동 발화를 차단(테스트는 sweep() 직접 호출)
prescription:
  read-timeout: 2s
  retry-backoffs: 50ms, 100ms
  sweep-initial-delay: PT1H
  sweep-fixed-delay: PT1H

# refresh_tokens 퍼지도 스위퍼와 동일하게 자동 발화 차단(테스트는 purge() 직접 호출).
# 배치 크기를 작게 둬 소수 행으로도 배치 반복(loop) 동작을 검증할 수 있게 한다.
refresh-token:
  purge-initial-delay: PT1H
  purge-fixed-delay: PT1H
  purge-batch-size: 2

# 환경 스냅샷 폴러도 동일하게 자동 발화 차단(테스트는 poll() 직접 호출).
environment-snapshot:
  poll-initial-delay: PT1H
  poll-fixed-delay: PT1H

# env_snapshots 퍼지도 동일 원칙 — 자동 발화 차단 + 작은 배치 크기로 반복 검증.
env-snapshot:
  purge-initial-delay: PT1H
  purge-fixed-delay: PT1H
  purge-batch-size: 2
