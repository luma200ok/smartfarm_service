# 서버 적용용 원본 nginx 설정 — 메타(A)가 서버의 /etc/nginx/sites-available/farm.luma200ok.com 로 설치 후
# sites-enabled 심링크를 건다. HTTP(80) 기준으로 작성 — certbot --nginx 실행 시 443 서버 블록과
# HTTP->HTTPS 리다이렉트가 자동 추가된다(docs/api-contract.md §0).
#
# /api/auth/login|signup|refresh 는 브루트포스 방어를 위해 limit_req 를 적용한다(BE 리뷰 P2-5, docs/STATUS.md).
limit_req_zone $binary_remote_addr zone=farm_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name farm.luma200ok.com;

    # 진단 이미지 업로드(멀티파트) — backend max-file-size 15MB 보다 여유 (application.yml)
    client_max_body_size 16m;

    # 인증 브루트포스 방어 대상 3개 엔드포인트만 별도 location으로 분리해 rate limit 적용
    location = /api/auth/login {
        limit_req zone=farm_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8085;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /api/auth/signup {
        limit_req zone=farm_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8085;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /api/auth/refresh {
        limit_req zone=farm_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8085;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # 나머지 API — 컨트롤러가 이미 /api 프리픽스를 포함하므로 proxy_pass에 경로를 붙이지 않는다
    # (backend/src/main/java/com/smartfarm/service/controller/*.java 의 @RequestMapping("/api/...") 참조)
    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Next.js 정적 자산 — 해시가 파일명에 포함되므로 장기 캐시
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

# /etc/nginx/snippets/proxy-common.conf 로 별도 저장(서버 최초 세팅, deploy/README.md 체크리스트 참조):
#
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
