# 홈서버 이전 파일럿(이슈 #27) — docker compose 스택.
# 실행 위치: 이 파일이 있는 deploy/home/ 디렉터리 (.env는 같은 디렉터리에 둔다, .env.example 참고)
#
# 네트워크 구성:
#   - default(내부): backend <-> frontend <-> nginx 컨테이너 간 통신
#   - shared-net(외부, 사전 생성 필요: `docker network create shared-net`): backend·nginx 조인
#     — backend: 호스트에 이미 떠 있는 db-postgres(PostgreSQL)·smartfarm-ai(AI 서버) 컨테이너 접근용.
#     README.md 체크리스트대로 db-postgres 쪽도 shared-net에 조인돼 있어야 backend가 붙을 수 있다.
#     — nginx: 독립 스택의 터널이 shared-net으로만 nginx에 도달하기 때문이다(#75). 아래 nginx 주석 참고.
#
# TLS는 이 스택에서 종단하지 않는다 — Cloudflare Tunnel이 종단하고 nginx는 평문 80만 처리한다.
# 터널 컨테이너는 이 스택에 없다(#75) — luma200ok/home-infra 의 tunnel 스택이 소유한다.
# ⚠️ 여기에 cloudflared를 다시 추가하지 말 것. 앱 배포 실패가 전 서비스를 내리는 구조가 되살아난다.

# 프로젝트명 고정 — 실행 CWD·유저에 따라 프로젝트명이 달라져 같은 스택이 이중으로 뜨는 것을 방지
name: smartfarm-home

networks:
  shared-net:
    external: true

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # 컨테이너 바인딩 오버라이드 — application.yml의 server.address(127.0.0.1)를 relaxed binding으로 덮어씀
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: prod
      # 진단 이미지 저장 경로 — 아래 volumes 바인드 마운트 대상과 반드시 일치(하드코딩)
      IMAGE_STORAGE_DIR: /data/images
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AI_SERVER_URL: ${AI_SERVER_URL}
      # KMA 단기예보(#56) — 키는 smartfarm-ai 스택과 동일한 값을 재사용(발급처 하나).
      # ⚠️ 2026-08-23 정정: 이전 주석은 "미설정이면 예보 API만 W001이고 다른 기능은 정상"이라고 했으나
      # 사실과 정반대다. KmaProperties가 @Validated + @NotBlank/@NotNull이라 값이 비면 Spring 컨텍스트
      # 자체가 뜨지 않는다(fail-fast는 의도된 설계). 실제로 이 값 누락으로 backend가 크래시 루프에 빠졌고,
      # 같은 배포가 터널까지 내려 전 서비스가 40분간 다운됐다(#75, #76).
      # :?required 가드 — 값이 없으면 컨테이너를 하나도 건드리기 전에 compose가 즉시 실패한다.
      # 이 가드가 있었다면 그날 배포는 build 이전에 멈췄고 터널은 재생성되지 않았다.
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:?required - /home/jb/srv/smartfarm/.env 에 설정}
      KMA_GRID_NX: ${KMA_GRID_NX:?required}
      KMA_GRID_NY: ${KMA_GRID_NY:?required}
      # 홈서버는 ollama·smartfarm-ai와 자원을 공유 — 기존 systemd 유닛(deploy/*.service)과 동일하게 512m 캡 유지
      JAVA_OPTS: -Xmx512m
    volumes:
      # ~ 사용 금지 — sudo 헬퍼(root)로 실행하면 ~가 /root로 풀린다. env-file의 DATA_DIR(절대경로)로
      # 주입하고, 미설정 시 :?로 즉시 실패시켜 잘못된 경로 마운트를 차단(예: DATA_DIR=/home/jb/srv/smartfarm)
      - ${DATA_DIR:?required}/images:/data/images
    networks:
      - default
      - shared-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # 메모리 상한(home-infra#9) — 실측 RSS 503MiB(-Xmx512m 힙 기준).
    # -Xmx512m은 "힙"만의 상한이고 그 위에 메타스페이스·코드캐시·스레드 스택·다이렉트/NIO 버퍼가 추가로
    # 붙는다 — JVM 프로세스 총 RSS는 대략 힙의 2~3배가 흔하다. 그래서 힙(512m)의 약 3배인 1.5G를 상한으로
    # 잡아 GC·클래스로딩 스파이크에 여유를 주면서도, 폭주 시엔 무관한 다른 컨테이너 대신 이 컨테이너만
    # OOM killer에 잡히게 한다.
    deploy:
      resources:
        limits:
          memory: 1.5G

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # 메모리 상한(home-infra#9) — 실측 RSS 40MiB(Next.js 프로덕션 서버, 정적 자산 위주).
    # 여유를 넉넉히 두어 512M — 트래픽 급증 시 Node 힙·캐시 증가를 흡수하면서도 무한대(0=무제한)는 피한다.
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 홈서버 로컬 스모크 전용 바인딩 — 외부 노출은 독립 스택의 터널이 담당(nginx는 127.0.0.1에만 publish)
      - "127.0.0.1:8088:80"
    # shared-net 조인(#75) — ⚠️ 이 줄을 지우면 farm.luma200ok.com 이 502가 된다.
    # 터널은 독립 스택(luma200ok/home-infra 의 tunnel)으로 분리되어 이 스택의 default 네트워크에 없다.
    # 따라서 터널이 nginx에 도달하는 경로는 shared-net 하나뿐이다. 다른 도메인은 각 컨테이너로 직행하므로
    # 이 조인이 빠져도 멀쩡하고, smartfarm만 죽는다 — 원인을 찾기 어려운 형태의 장애다.
    networks:
      - default
      - shared-net
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    # 메모리 상한(home-infra#9) — 실측 RSS 5MiB(nginx:alpine, 단순 리버스 프록시 설정).
    # 자체 사용량은 매우 낮지만 커넥션 버퍼링·워커 프로세스 여유를 위해 256M으로 설정(0=무제한 회피).
    deploy:
      resources:
        limits:
          memory: 256M
