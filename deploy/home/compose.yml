# 홈서버 이전 파일럿(이슈 #27) — docker compose 스택.
# 실행 위치: 이 파일이 있는 deploy/home/ 디렉터리 (.env는 같은 디렉터리에 둔다, .env.example 참고)
#
# 네트워크 구성:
#   - default(내부): backend <-> frontend <-> nginx <-> cloudflared 컨테이너 간 통신
#   - shared-net(외부, 사전 생성 필요: `docker network create shared-net`): backend·cloudflared 조인
#     — 호스트에 이미 떠 있는 db-postgres(PostgreSQL)·smartfarm-ai(AI 서버) 컨테이너 접근용.
#     README.md 체크리스트대로 db-postgres 쪽도 shared-net에 조인돼 있어야 backend가 붙을 수 있다.
#     cloudflared는 smartfarm-ai 스택의 streamlit을 터널로 직접 서빙하려고 조인한다(#67).
#
# TLS는 이 스택에서 종단하지 않는다 — cloudflared(Cloudflare Tunnel)가 종단하고 nginx는 평문 80만 처리한다.

# 프로젝트명 고정 — 실행 CWD·유저에 따라 프로젝트명이 달라져 같은 스택이 이중으로 뜨는 것을 방지
name: smartfarm-home

networks:
  shared-net:
    external: true

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # 컨테이너 바인딩 오버라이드 — application.yml의 server.address(127.0.0.1)를 relaxed binding으로 덮어씀
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: prod
      # 진단 이미지 저장 경로 — 아래 volumes 바인드 마운트 대상과 반드시 일치(하드코딩)
      IMAGE_STORAGE_DIR: /data/images
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AI_SERVER_URL: ${AI_SERVER_URL}
      # KMA 단기예보(#56) — 키는 smartfarm-ai 스택과 동일한 값을 재사용(발급처 하나). 미설정이면
      # 예보 API만 W001이고 다른 기능은 정상 동작한다.
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY}
      KMA_GRID_NX: ${KMA_GRID_NX}
      KMA_GRID_NY: ${KMA_GRID_NY}
      # 홈서버는 ollama·smartfarm-ai와 자원을 공유 — 기존 systemd 유닛(deploy/*.service)과 동일하게 512m 캡 유지
      JAVA_OPTS: -Xmx512m
    volumes:
      # ~ 사용 금지 — sudo 헬퍼(root)로 실행하면 ~가 /root로 풀린다. env-file의 DATA_DIR(절대경로)로
      # 주입하고, 미설정 시 :?로 즉시 실패시켜 잘못된 경로 마운트를 차단(예: DATA_DIR=/home/jb/srv/smartfarm)
      - ${DATA_DIR:?required}/images:/data/images
    networks:
      - default
      - shared-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 홈서버 로컬 스모크 전용 바인딩 — 외부 노출은 cloudflared 터널이 담당(nginx는 127.0.0.1에만 publish)
      - "127.0.0.1:8088:80"
    # shared-net 조인(#75) — 터널을 독립 스택으로 분리하기 위한 선행 조건.
    # 지금은 cloudflared가 이 스택의 default 네트워크에 함께 있어서 nginx에 닿지만, 터널이 분리되면
    # default를 잃는다. 그때 nginx가 shared-net에 없으면 터널이 nginx에 도달하지 못해 farm만 502가 된다
    # (다른 도메인은 shared-net으로 직행하므로 멀쩡하다). 네트워크 추가일 뿐 제거가 아니라 기존 경로는 그대로다.
    networks:
      - default
      - shared-net
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # 토큰을 CLI 인자 대신 env로 전달 — `docker inspect`(Config.Cmd)에 평문 노출되는 경로를 줄인다(리뷰 P2-2)
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    # shared-net 조인(#67) — smartfarm-ai 스택의 streamlit 컨테이너를 터널로 직접 서빙하기 위함
    # (Public Hostname smartfarm-ai.luma200ok.com → http://smartfarm-ai-streamlit:8501).
    networks:
      - default
      - shared-net
    depends_on:
      - nginx
