# 홈서버 이전 파일럿(이슈 #27) — docker compose 스택.
# 실행 위치: 이 파일이 있는 deploy/home/ 디렉터리 (.env는 같은 디렉터리에 둔다, .env.example 참고)
#
# 네트워크 구성:
#   - default(내부): backend <-> frontend <-> nginx <-> cloudflared 컨테이너 간 통신
#   - shared-net(외부, 사전 생성 필요: `docker network create shared-net`): backend만 조인
#     — 호스트에 이미 떠 있는 db-postgres(PostgreSQL)·smartfarm-ai(AI 서버) 컨테이너 접근용.
#     README.md 체크리스트대로 db-postgres 쪽도 shared-net에 조인돼 있어야 backend가 붙을 수 있다.
#
# TLS는 이 스택에서 종단하지 않는다 — cloudflared(Cloudflare Tunnel)가 종단하고 nginx는 평문 80만 처리한다.

networks:
  shared-net:
    external: true

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # 컨테이너 바인딩 오버라이드 — application.yml의 server.address(127.0.0.1)를 relaxed binding으로 덮어씀
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: prod
      # 진단 이미지 저장 경로 — 아래 volumes 바인드 마운트 대상과 반드시 일치(하드코딩)
      IMAGE_STORAGE_DIR: /data/images
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AI_SERVER_URL: ${AI_SERVER_URL}
      # 홈서버는 ollama·smartfarm-ai와 자원을 공유 — 기존 systemd 유닛(deploy/*.service)과 동일하게 512m 캡 유지
      JAVA_OPTS: -Xmx512m
    volumes:
      - ~/srv/smartfarm/images:/data/images
    networks:
      - default
      - shared-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 홈서버 로컬 스모크 전용 바인딩 — 외부 노출은 cloudflared 터널이 담당(nginx는 127.0.0.1에만 publish)
      - "127.0.0.1:8088:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # 토큰을 CLI 인자 대신 env로 전달 — `docker inspect`(Config.Cmd)에 평문 노출되는 경로를 줄인다(리뷰 P2-2)
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - nginx
