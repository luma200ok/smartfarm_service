# 홈서버 이전 파일럿(이슈 #27) — deploy/nginx-farm.conf를 컨테이너용으로 이식.
# nginx:alpine 기본 이미지의 /etc/nginx/nginx.conf가 `include /etc/nginx/conf.d/*.conf;`로 이 파일을
# http 컨텍스트에 포함하므로, limit_req_zone이 파일 최상단(server 블록 밖)에 있어도 그대로 유효하다
# (원본 deploy/README.md §6 각주와 동일한 구조).
#
# TLS는 이 컨테이너에서 종단하지 않는다 — cloudflared가 Cloudflare 엣지에서 종단하고 이 nginx까지는
# 평문 HTTP로 터널링한다. 따라서 실제 클라이언트 IP는 $remote_addr(터널 컨테이너의 IP)이 아니라
# Cloudflare가 실어 보내는 Cf-Connecting-Ip 헤더에만 있다 — rate-limit 키와 X-Real-IP 모두
# $binary_remote_addr/$remote_addr 대신 $http_cf_connecting_ip를 사용한다(리뷰 P3).
limit_req_zone $http_cf_connecting_ip zone=farm_auth:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # 진단 이미지 업로드(멀티파트) — backend max-file-size 15MB 보다 여유 (application.yml)
    client_max_body_size 16m;

    # 도커 내장 DNS(127.0.0.11) — proxy_pass 대상을 변수로 둬서 요청 시점마다 재조회하게 한다.
    # (리터럴 호스트로 proxy_pass하면 nginx가 시작 시 1회만 resolve해 캐시하므로, backend/frontend만
    #  재기동되면 IP가 바뀌어도 nginx가 옛 IP로 계속 붙어 502가 날 수 있다 — 리뷰 P2-3)
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8085;
    set $frontend_upstream http://frontend:3000;

    # 인증 브루트포스·남용 방어 대상 4개 엔드포인트만 별도 location으로 분리해 rate limit 적용
    location = /api/auth/login {
        limit_req zone=farm_auth burst=10 nodelay;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/signup {
        limit_req zone=farm_auth burst=10 nodelay;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/refresh {
        limit_req zone=farm_auth burst=10 nodelay;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 데모 로그인(이슈 #49) — 자격증명 없는 공개 토큰 발급 엔드포인트라 남용(토큰 대량 발급) 방어 필수
    location = /api/auth/demo-login {
        limit_req zone=farm_auth burst=10 nodelay;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 나머지 API — 컨트롤러가 이미 /api 프리픽스를 포함하므로 proxy_pass에 경로를 붙이지 않는다
    # (backend/src/main/java/com/smartfarm/service/controller/*.java 의 @RequestMapping("/api/...") 참조)
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 정적 자산 — 해시가 파일명에 포함되므로 장기 캐시. 다른 location과 동일하게 공통 proxy 헤더 적용.
    location /_next/static/ {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
