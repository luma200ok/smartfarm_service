name: Deploy

# main push 시 arm1(oci-arm1) 자동 배포 (docs/_local/handoff/infra-7-deploy-next.md).
# 시크릿(메타가 등록): OCI_HOST, OCI_USER(opc), OCI_SSH_KEY.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # workflow_dispatch 등 base가 없는 경우 안전하게 둘 다 배포
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        # main 머지 전 CI(ci.yml)에서 이미 테스트를 통과했다는 전제로 -x test (handoff 재량)
        run: ./gradlew bootJar -x test

      - name: Upload jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: 'backend/build/libs/*.jar'
          target: '/home/opc/apps/smartfarm-service/incoming'
          strip_components: 3
          overwrite: true

      - name: Restart backend & health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/opc/apps/smartfarm-service
            JAR="$(ls incoming/*.jar | head -n1)"
            # 수동 롤백 여지 — 직전 배포 jar를 1세대만 보관(deploy/README.md 롤백 절차 참조)
            cp -f app.jar app.jar.bak 2>/dev/null || true
            mv "$JAR" app.jar.new
            mv -f app.jar.new app.jar
            rm -f incoming/*.jar
            sudo systemctl restart smartfarm-service-backend

            # 전용 헬스 엔드포인트 GET /api/health (무인증, SecurityConfig permitAll — HealthController).
            # /api/health-nonexistent 로 404를 기대하는 방식은 Spring Security 필터가 컨트롤러 라우팅보다 먼저
            # 401(A004)을 커밋해 실제로는 도달 불가하다(code-reviewer 확정) — 200 판정으로 교체.
            # (서버는 127.0.0.1에만 바인딩되므로 이 curl은 반드시 서버 내부(SSH 세션)에서 실행한다.
            #  connection refused 등 접속 실패도 http_code가 000 등으로 잡혀 200과 구분되어 재시도된다.)
            ok=""
            for i in 1 2 3 4 5 6; do
              sleep 5
              code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/api/health || true)"
              if [ "$code" = "200" ]; then
                echo "backend healthy (attempt $i, http $code)"
                ok=1
                break
              fi
              echo "backend not ready yet (attempt $i, http $code)"
            done
            if [ -z "$ok" ]; then
              echo "backend health check failed after 6 attempts" >&2
              sudo journalctl -u smartfarm-service-backend -n 100 --no-pager || true
              exit 1
            fi

  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://farm.luma200ok.com

      - name: Package standalone output
        # .next/standalone 은 server.js + 필요한 node_modules 를 실제 파일로 포함한다(심링크 아님 — npm 워크스페이스가
        # 아니므로 Turbopack/standalone 의 심링크 node_modules 함정과 무관). .next/static, public 은 standalone 밖에
        # 있으므로 배포 tar에 수동으로 합쳐 넣는다.
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf ../frontend-dist.tar.gz -C .next/standalone .

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: 'frontend-dist.tar.gz'
          target: '/home/opc/apps/smartfarm-service/frontend'
          strip_components: 0
          overwrite: true

      - name: Atomic swap & restart frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/opc/apps/smartfarm-service/frontend
            ts="$(date +%Y%m%d%H%M%S)"
            release_dir="releases/$ts"
            mkdir -p "$release_dir"
            tar -xzf frontend-dist.tar.gz -C "$release_dir"
            rm -f frontend-dist.tar.gz

            # 원자적 교체: rename(2)은 같은 파일시스템 내에서 원자적이라 무중단 스왑이 가능하다.
            # (심링크가 아니라 실제 디렉터리로 tar를 풀었으므로 node_modules 심링크 함정 없음)
            ln -sfn "$(pwd)/$release_dir" current.tmp
            mv -Tf current.tmp current

            sudo systemctl restart smartfarm-service-frontend

            ok=""
            for i in 1 2 3 4 5 6; do
              sleep 5
              code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
              if [ "$code" = "200" ]; then
                echo "frontend healthy (attempt $i, http $code)"
                ok=1
                break
              fi
              echo "frontend not ready yet (attempt $i, http $code)"
            done
            if [ -z "$ok" ]; then
              echo "frontend health check failed after 6 attempts" >&2
              sudo journalctl -u smartfarm-service-frontend -n 100 --no-pager || true
              exit 1
            fi

            # 오래된 릴리스 정리 — 최근 3개만 보존
            ls -1dt releases/*/ 2>/dev/null | tail -n +4 | xargs -r rm -rf
