name: CI

# PR 검증 — main으로 향하는 PR에서 변경된 영역만 빌드/테스트한다 (docs/_local/handoff/infra-7-deploy-next.md).
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        # Testcontainers(PG16)가 컨테이너를 직접 기동한다 — ubuntu-latest에는 Docker가 내장돼 있어 별도 설정 불필요.
        # 테스트는 application-test.yml(@ActiveProfiles("test"))을 사용하므로 실제 DB 접속정보는 필요 없다.
        run: ./gradlew test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # vitest 유닛 테스트(이슈 #148에서 도입) — CI가 돌리지 않으면 테스트가 장식이 된다.
      # 네트워크를 타지 않고(fetch 전부 모킹) 1초 내 끝나므로 PR 게이트에 부담이 없다.
      - name: Test
        run: npm test

      - name: Build
        # 프로덕션 값과 동일하게 빌드 검증(docs/api-contract.md §6) — next.config.ts가 미설정 시 빌드를 실패시킨다.
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://farm.luma200ok.com
